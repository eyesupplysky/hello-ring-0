name: Build and verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm lld qemu-system-x86

      - name: Build disk image
        run: ./build.sh

      - name: Run kernel headless and assert checkpoints
        env:
          BOOT_WAIT: 8
        run: ./run.sh

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics
          path: |
            build/disk.img
            build/qemu.log
            build/serial.log
          if-no-files-found: ignore
